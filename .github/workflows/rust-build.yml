name: Nova Rust — macOS · Windows · Linux
on:
  push:
    branches: [main]
    tags: ['rust-v*']
  workflow_dispatch:
    inputs:
      linux_only:
        description: 'Build only the Linux installers'
        type: boolean
        default: false
concurrency:
  group: nova-rust-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
jobs:
  build:
    name: ${{ matrix.label }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.linux_only && '[{"os":"ubuntu-22.04","label":"Linux-x64","bundles":"appimage,deb"}]' || '[{"os":"macos-15","label":"macOS-ARM64","arch":"arm64"},{"os":"macos-15-intel","label":"macOS-Intel","arch":"x86_64"},{"os":"windows-latest","label":"Windows-x64","bundles":"nsis"},{"os":"ubuntu-22.04","label":"Linux-x64","bundles":"appimage,deb"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check release tag and toolchain
        shell: bash
        run: |
          rustc --version
          python -c 'import json,os; v=json.load(open("tauri.conf.json"))["version"]; ref=os.environ["GITHUB_REF_NAME"]; assert not ref.startswith("rust-v") or ref=="rust-v"+v, "Release tag must match app version"'
      - name: Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          # Keep Ubuntu signature verification; bypass an unresponsive Azure HTTP mirror.
          echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors-security.txt
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Languages=none update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb
      - name: Unit tests
        run: cargo test --release --locked
      - name: Compile Rust launcher
        run: cargo build --release --locked
      - name: Test macOS interface
        if: runner.os == 'macOS'
        run: ./target/release/nova-rust --smoke
      - name: Test Linux interface
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: xvfb-run -a --server-args='-screen 0 1280x800x24' ./target/release/nova-rust --smoke
      - name: Test Windows interface
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath '.\target\release\nova-rust.exe' -ArgumentList '--smoke' -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw "UI check failed: $($app.ExitCode)" }
          if (-not (Test-Path 'target/ui-smoke.json')) { throw 'No UI test report' }
          if (-not (Get-Content 'target/ui-smoke.json' -Raw | ConvertFrom-Json).ok) { throw 'UI test did not pass' }
      - name: Package signed macOS application
        if: runner.os == 'macOS'
        run: |
          python3 scripts/package.py --skip-build
          file 'dist/Nova Rust.app/Contents/MacOS/nova-rust' | grep '${{ matrix.arch }}'
          codesign --verify --deep --strict 'dist/Nova Rust.app'
          'dist/Nova Rust.app/Contents/MacOS/nova-rust' --smoke
      - uses: actions/setup-node@v7
        if: runner.os != 'macOS'
        with:
          node-version: 22
      - name: Package Windows and Linux installers
        if: runner.os != 'macOS'
        shell: python
        run: |
          import os, subprocess, time, uuid
          command=['npx'+('.cmd' if __import__('os').name=='nt' else ''),'--yes','@tauri-apps/cli@2.12.4','build','--bundles','${{ matrix.bundles }}']
          for attempt in range(3):
              build_env=os.environ.copy()
              build_env['TAURI_BUNDLER_TOOLS_GITHUB_MIRROR_TEMPLATE']='https://github.com/<owner>/<repo>/releases/download/<version>/<asset>?nova_bundle='+uuid.uuid4().hex
              result=subprocess.run(command,env=build_env)
              if result.returncode==0: break
              if attempt==2: raise SystemExit(result.returncode)
              time.sleep(10)
        env:
          NO_STRIP: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: Nova-Rust-${{ matrix.label }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/ui-smoke.json
  publish:
    name: Publish verified installers
    if: startsWith(github.ref, 'refs/tags/rust-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: Nova-Rust-*
          path: artifacts
      - name: Collect and verify platform files
        shell: python
        run: |
          from pathlib import Path
          import hashlib, shutil
          out=Path('installers'); out.mkdir()
          for platform in Path('artifacts').iterdir():
              files=[p for p in platform.rglob('*') if p.is_file() and p.suffix in {'.dmg','.exe','.AppImage','.deb'}]
              assert files, 'Missing installer: '+platform.name
              for file in files: shutil.copy2(file,out/(platform.name+'-'+file.name))
          names=[p.name for p in out.iterdir()]
          for platform in ['macOS-ARM64','macOS-Intel','Windows-x64','Linux-x64']: assert any(platform in n for n in names), 'Missing '+platform
          (out/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir())))
      - name: Publish complete Rust beta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$TAG" --verify-tag --draft --prerelease --title "Nova Rust ${TAG#rust-v}" --notes-file RELEASE_NOTES.md
          gh release upload "$TAG" installers/*
          gh release edit "$TAG" --draft=false
