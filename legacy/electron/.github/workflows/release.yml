name: Build Nova
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: nova-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
            label: macOS
          - os: windows-latest
            args: --win --x64
            label: Windows
          - os: ubuntu-latest
            args: --linux --x64
            label: Linux
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) throw Error('Tag must match package.json version')"
      - run: npm ci
      - run: npm test
      - name: Build installers
        run: node .github/scripts/build.cjs ${{ matrix.args }} --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify macOS signatures and packaged startup
        if: runner.os == 'macOS'
        run: |
          npm run test:startup
          npm run test:packaged:mac
      - uses: actions/upload-artifact@v4
        with:
          name: Nova-${{ matrix.label }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.yml
            dist/*.blockmap
  release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: Nova-*
          merge-multiple: true
          path: release-files
      - name: Publish installers after every platform passes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(release-files/*.dmg release-files/*.zip release-files/*.exe release-files/*.AppImage release-files/*.blockmap release-files/latest*.yml)
          test "${#files[@]}" -gt 0
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > /tmp/nova-release-state.json 2>/dev/null; then
            node -e "if (!require('/tmp/nova-release-state.json').isDraft) throw Error('A published release already exists; use a new version')"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Nova ${RELEASE_TAG#v}" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
